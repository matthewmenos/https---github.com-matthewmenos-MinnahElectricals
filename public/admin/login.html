<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin login for Elite Electrical Services">
  <title>Admin Login | Minnah Electricals</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg?v=2" sizes="32x32">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0F172A',
            amber: '#F59E0B',
            'amber-dark': '#D97706',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-navy min-h-screen flex items-center justify-center">

  <div class="container mx-auto px-4">
    <div class="max-w-md mx-auto">
      <!-- Logo -->
      <div class="text-center mb-8">
        <img src="/assets/logo.jpg" alt="Minnah Electricals Logo" class="h-24 w-24 rounded-full object-cover border-4 border-amber mx-auto mb-4">
        <h1 class="text-3xl font-bold text-white mb-2">Minnah Electricals</h1>
        <p class="text-gray-300">Admin Portal</p>
      </div>

      <!-- Login Form -->
      <div class="bg-white rounded-lg shadow-2xl p-8">
        <h2 class="text-2xl font-bold text-navy mb-6">Admin Login</h2>
        
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-gray-700 text-sm font-semibold mb-2">Username</label>
            <input 
              type="text" 
              id="username" 
              required 
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber focus:border-transparent"
              placeholder="Enter username"
              autocomplete="username"
            >
          </div>

          <div>
            <label class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
            <div class="relative">
              <input 
                type="password" 
                id="password" 
                required 
                class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber focus:border-transparent"
                placeholder="Enter password"
                autocomplete="current-password"
              >
              <button 
                type="button" 
                id="togglePassword" 
                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none"
                aria-label="Toggle password visibility"
              >
                <svg id="eyeIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
                <svg id="eyeOffIcon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.059 10.059 0 013.999-5.399m3.415-3.415A10.05 10.05 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.059 10.059 0 01-3.999 5.399M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.058 10.058 0 01-3.999 5.399M3 3l18 18"></path>
                </svg>
              </button>
            </div>
          </div>

          <button 
            type="submit" 
            id="loginBtn"
            class="w-full bg-amber hover:bg-amber-dark text-navy font-bold py-3 rounded-lg transition"
          >
            Sign In
          </button>
        </form>

        <div id="loginMessage" class="mt-4 hidden"></div>

        <div class="mt-6 pt-6 border-t border-gray-200">
          <p class="text-sm text-gray-600 text-center">
            <a href="/" class="text-amber hover:text-amber-dark font-semibold">← Back to Website</a>
          </p>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center mt-8 text-gray-400 text-sm">
        <p>&copy; 2026 Minnah Electricals. All rights reserved.</p>
        <p class="mt-2">Powered By: <a href="https://menositconsult.godaddysites.com" class="text-amber hover:text-amber-dark font-semibold">Menos iT Consult</a></p>
      </div>
    </div>
  </div>

  <script>
    // Password reveal functionality
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');

    togglePasswordBtn.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      // Toggle icons
      if (type === 'text') {
        eyeIcon.classList.add('hidden');
        eyeOffIcon.classList.remove('hidden');
      } else {
        eyeIcon.classList.remove('hidden');
        eyeOffIcon.classList.add('hidden');
      }
    });
  </script>
  <script src="/js/admin.js"></script>
</body>
</html>
