<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin login for Elite Electrical Services">
  <title>Admin Login | Minnah Electricals</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any">
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" sizes="32x32">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0F172A',
            amber: '#F59E0B',
            'amber-dark': '#D97706',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-navy min-h-screen flex items-center justify-center">

  <div class="container mx-auto px-4">
    <div class="max-w-md mx-auto">
      <!-- Logo -->
      <div class="text-center mb-8">
        <img src="/assets/logo.jpg" alt="Minnah Electricals Logo" class="h-24 w-24 rounded-full object-cover border-4 border-amber mx-auto mb-4">
        <h1 class="text-3xl font-bold text-white mb-2">Minnah Electricals</h1>
        <p class="text-gray-300">Admin Portal</p>
      </div>

      <!-- Login Form -->
      <div class="bg-white rounded-lg shadow-2xl p-8">
        <h2 class="text-2xl font-bold text-navy mb-6">Admin Login</h2>
        
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-gray-700 text-sm font-semibold mb-2">Username</label>
            <input 
              type="text" 
              id="username" 
              required 
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber focus:border-transparent"
              placeholder="Enter username"
              autocomplete="username"
            >
          </div>

          <div>
            <label class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
            <input 
              type="password" 
              id="password" 
              required 
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber focus:border-transparent"
              placeholder="Enter password"
              autocomplete="current-password"
            >
          </div>

          <button 
            type="submit" 
            id="loginBtn"
            class="w-full bg-amber hover:bg-amber-dark text-navy font-bold py-3 rounded-lg transition"
          >
            Sign In
          </button>
        </form>

        <div id="loginMessage" class="mt-4 hidden"></div>

        <div class="mt-6 pt-6 border-t border-gray-200">
          <p class="text-sm text-gray-600 text-center">
            <a href="/" class="text-amber hover:text-amber-dark font-semibold">← Back to Website</a>
          </p>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center mt-8 text-gray-400 text-sm">
        <p>&copy; 2024 Minnah Electricals. All rights reserved.</p>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
