<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin dashboard for managing leads">
  <title>Admin Dashboard | Minnah Electricals</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any">
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" sizes="32x32">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0F172A',
            amber: '#F59E0B',
            'amber-dark': '#D97706',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Header -->
  <header class="bg-navy text-white shadow-lg">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between py-4">
        <div class="flex items-center space-x-3">
          <img src="/assets/logo.jpg" alt="Minnah Electricals Logo" class="h-12 w-12 rounded-full object-cover border-2 border-amber">
          <div>
          <h1 class="text-xl font-bold">Minnah Electricals</h1>
          <p class="text-xs text-gray-300">Admin Dashboard</p>
          </div>
        </div>
        <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-semibold transition">
          Log Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-8">
    
    <!-- Stats Cards -->
    <div class="grid md:grid-cols-4 gap-6 mb-8">
      <div class="bg-white rounded-lg shadow p-6">
        <div class="text-gray-500 text-sm font-semibold mb-2">Total Leads</div>
        <div id="totalLeads" class="text-3xl font-bold text-navy">0</div>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <div class="text-gray-500 text-sm font-semibold mb-2">New Leads</div>
        <div id="newLeads" class="text-3xl font-bold text-amber">0</div>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <div class="text-gray-500 text-sm font-semibold mb-2">Recent (7 Days)</div>
        <div id="recentLeads" class="text-3xl font-bold text-blue-600">0</div>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <div class="text-gray-500 text-sm font-semibold mb-2">Emergency</div>
        <div id="emergencyLeads" class="text-3xl font-bold text-red-600">0</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="flex flex-wrap gap-2">
          <button data-filter="all" class="filter-btn active bg-navy text-white px-4 py-2 rounded-lg font-semibold transition">
            All
          </button>
          <button data-filter="New" class="filter-btn bg-gray-200 hover:bg-gray-300 text-navy px-4 py-2 rounded-lg font-semibold transition">
            New
          </button>
          <button data-filter="Contacted" class="filter-btn bg-gray-200 hover:bg-gray-300 text-navy px-4 py-2 rounded-lg font-semibold transition">
            Contacted
          </button>
          <button data-filter="Scheduled" class="filter-btn bg-gray-200 hover:bg-gray-300 text-navy px-4 py-2 rounded-lg font-semibold transition">
            Scheduled
          </button>
          <button data-filter="Completed" class="filter-btn bg-gray-200 hover:bg-gray-300 text-navy px-4 py-2 rounded-lg font-semibold transition">
            Completed
          </button>
        </div>
        <button id="refreshBtn" class="bg-amber hover:bg-amber-dark text-navy px-4 py-2 rounded-lg font-semibold transition flex items-center">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          Refresh
        </button>
      </div>
    </div>

    <!-- Leads Table -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-navy text-white">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Date</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Client Name</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Phone</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Email</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Service</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Urgency</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Status</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody id="leadsTableBody" class="bg-white divide-y divide-gray-200">
            <!-- Leads will be populated here -->
          </tbody>
        </table>
      </div>
      
      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-12">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <h3 class="mt-2 text-sm font-medium text-gray-900">No leads found</h3>
        <p class="mt-1 text-sm text-gray-500">Get started by receiving a new lead from the website.</p>
      </div>
    </div>

  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
