<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments - Admin Dashboard</title>
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2><i class="fas fa-bolt"></i> Admin Panel</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin"><i class="fas fa-dashboard"></i> Dashboard</a>
        <a href="/admin/leads"><i class="fas fa-users"></i> Leads</a>
        <a href="/admin/orders"><i class="fas fa-shopping-cart"></i> Orders</a>
        <a href="/admin/products"><i class="fas fa-box"></i> Products</a>
        <a href="/admin/appointments" class="active"><i class="fas fa-calendar"></i> Appointments</a>
        <a href="/admin/service-requests"><i class="fas fa-tools"></i> Service Requests</a>
        <a href="/admin/customers"><i class="fas fa-user-friends"></i> Customers</a>
        <a href="/admin/loyalty"><i class="fas fa-star"></i> Loyalty Program</a>
        <a href="/admin/newsletter"><i class="fas fa-envelope"></i> Newsletter</a>
        <a href="/admin/analytics"><i class="fas fa-chart-line"></i> Analytics</a>
        <a href="/admin/settings"><i class="fas fa-cog"></i> Settings</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <h1>Appointment Management</h1>
        <div class="user-info">
          <span id="usernameDisplay"></span>
          <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
      </header>

      <div class="content">
        <!-- Filters -->
        <div class="filters">
          <div class="filter-group">
            <label>Status:</label>
            <select id="statusFilter" onchange="loadAppointments()">
              <option value="all">All</option>
              <option value="Pending">Pending</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <div class="filter-group">
            <label>From:</label>
            <input type="date" id="dateFrom" onchange="loadAppointments()">
          </div>
          <div class="filter-group">
            <label>To:</label>
            <input type="date" id="dateTo" onchange="loadAppointments()">
          </div>
          <button onclick="clearFilters()" class="btn-secondary">Clear Filters</button>
        </div>

        <!-- Appointments Table -->
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Service</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="appointmentsTable">
              <tr>
                <td colspan="8" class="loading">Loading appointments...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Appointment</h2>
        <span class="close" onclick="closeModal()">&times;</span>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" id="editId">
          <div class="form-group">
            <label>Status</label>
            <select id="editStatus" required>
              <option value="Pending">Pending</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <div class="form-group">
            <label>Notes</label>
            <textarea id="editNotes" rows="4"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Save Changes</button>
            <button type="button" onclick="closeModal()" class="btn-secondary">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    let authToken = localStorage.getItem('authToken');
    let currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');

    // Check authentication
    if (!authToken || !currentUser.username) {
      window.location.href = '/admin/login';
    } else {
      document.getElementById('usernameDisplay').textContent = currentUser.username;
    }

    // Load appointments on page load
    document.addEventListener('DOMContentLoaded', loadAppointments);

    async function loadAppointments() {
      const status = document.getElementById('statusFilter').value;
      const dateFrom = document.getElementById('dateFrom').value;
      const dateTo = document.getElementById('dateTo').value;

      let url = `/api/admin/appointments?status=${status}`;
      if (dateFrom) url += `&date_from=${dateFrom}`;
      if (dateTo) url += `&date_to=${dateTo}`;

      try {
        const response = await fetch(url, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await response.json();

        if (data.success) {
          displayAppointments(data.appointments);
        }
      } catch (error) {
        console.error('Error loading appointments:', error);
        showNotification('Error loading appointments', 'error');
      }
    }

    function displayAppointments(appointments) {
      const tbody = document.getElementById('appointmentsTable');

      if (appointments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="no-data">No appointments found</td></tr>';
        return;
      }

      tbody.innerHTML = appointments.map(apt => `
        <tr>
          <td>#${apt.id}</td>
          <td>${apt.customer_name}</td>
          <td>${apt.customer_phone}</td>
          <td>${apt.service_type}</td>
          <td>${apt.appointment_date}</td>
          <td>${apt.appointment_time}</td>
          <td><span class="status-badge status-${apt.status.toLowerCase()}">${apt.status}</span></td>
          <td>
            <button onclick="editAppointment(${apt.id})" class="btn-edit"><i class="fas fa-edit"></i></button>
            <button onclick="deleteAppointment(${apt.id})" class="btn-delete"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    async function editAppointment(id) {
      try {
        const response = await fetch(`/api/admin/appointments/${id}`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await response.json();

        if (data.success) {
          const appointment = data.appointment;
          document.getElementById('editId').value = appointment.id;
          document.getElementById('editStatus').value = appointment.status;
          document.getElementById('editNotes').value = appointment.notes || '';
          document.getElementById('editModal').style.display = 'block';
        }
      } catch (error) {
        console.error('Error fetching appointment:', error);
        showNotification('Error loading appointment details', 'error');
      }
    }

    async function updateAppointment(e) {
      e.preventDefault();

      const id = document.getElementById('editId').value;
      const status = document.getElementById('editStatus').value;
      const notes = document.getElementById('editNotes').value;

      try {
        const response = await fetch(`/api/admin/appointments/${id}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${authToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status, notes })
        });

        const data = await response.json();

        if (data.success) {
          showNotification('Appointment updated successfully', 'success');
          closeModal();
          loadAppointments();
        } else {
          showNotification(data.message, 'error');
        }
      } catch (error) {
        console.error('Error updating appointment:', error);
        showNotification('Error updating appointment', 'error');
      }
    }

    async function deleteAppointment(id) {
      if (!confirm('Are you sure you want to delete this appointment?')) return;

      try {
        const response = await fetch(`/api/admin/appointments/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        const data = await response.json();

        if (data.success) {
          showNotification('Appointment deleted successfully', 'success');
          loadAppointments();
        } else {
          showNotification(data.message, 'error');
        }
      } catch (error) {
        console.error('Error deleting appointment:', error);
        showNotification('Error deleting appointment', 'error');
      }
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function clearFilters() {
      document.getElementById('statusFilter').value = 'all';
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
      loadAppointments();
    }

    function logout() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('currentUser');
      window.location.href = '/admin/login';
    }

    function showNotification(message, type) {
      const notification = document.createElement('div');
      notification.className = `notification notification-${type}`;
      notification.textContent = message;
      document.body.appendChild(notification);
      setTimeout(() => notification.remove(), 3000);
    }

    // Form submission
    document.getElementById('editForm').addEventListener('submit', updateAppointment);

    // Close modal on outside click
    window.onclick = function(event) {
      const modal = document.getElementById('editModal');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
