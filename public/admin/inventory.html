<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inventory management">
  <title>Inventory | Minnah Electricals</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg?v=2" sizes="32x32">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { navy: '#0F172A', amber: '#F59E0B', 'amber-dark': '#D97706' }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="bg-gray-50">
  <header class="bg-navy text-white shadow-lg">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between py-4">
        <a href="/admin/index.html" class="flex items-center space-x-3">
          <img src="/assets/logo.jpg" alt="Logo" class="h-12 w-12 rounded-full object-cover border-2 border-amber">
          <div>
            <h1 class="text-xl font-bold">Minnah Electricals</h1>
            <p class="text-xs text-gray-300">Admin - Inventory</p>
          </div>
        </a>
        <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-semibold transition">Log Out</button>
      </div>
    </div>
  </header>

  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="container mx-auto px-4">
      <div class="flex space-x-6 overflow-x-auto">
        <a href="/admin/index.html" class="py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-semibold text-sm">Dashboard</a>
        <a href="/admin/leads.html" class="py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-semibold text-sm">Leads</a>
        <a href="/admin/products.html" class="py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-semibold text-sm">Products</a>
        <a href="/admin/orders.html" class="py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-semibold text-sm">Orders</a>
        <a href="/admin/portfolio.html" class="py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-semibold text-sm">Portfolio</a>
        <a href="/admin/gallery.html" class="py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-semibold text-sm">Gallery</a>
        <a href="/admin/analytics.html" class="py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-semibold text-sm">Analytics</a>
        <a href="/admin/loyalty.html" class="py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-semibold text-sm">Loyalty</a>
        <a href="/admin/customers.html" class="py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-semibold text-sm">Customers</a>
        <a href="/admin/inventory.html" class="py-4 px-1 border-b-2 border-amber text-amber font-semibold text-sm">Inventory</a>
        <a href="/admin/settings.html" class="py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-semibold text-sm">Settings</a>
        <a href="/admin/templates.html" class="py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-semibold text-sm">Templates</a>
      </div>
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8">
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-navy mb-2">Inventory Management</h2>
      <p class="text-gray-500">Monitor your product inventory</p>
    </div>

    <div class="bg-white rounded-lg shadow p-4 mb-6">
      <div class="flex flex-wrap items-center gap-3">
        <label class="text-sm font-semibold text-gray-700">Filter:</label>

        <select id="statusFilter" onchange="applyInventoryFilters()" class="border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber focus:border-transparent bg-white cursor-pointer appearance-none">
          <option value="all">All Products</option>
          <option value="in_stock">In Stock</option>
          <option value="out_of_stock">Out of Stock</option>
        </select>

        <select id="categoryFilter" onchange="applyInventoryFilters()" class="border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber focus:border-transparent bg-white cursor-pointer appearance-none">
          <option value="all">All Categories</option>
        </select>

        <select id="sortFilter" onchange="applyInventoryFilters()" class="border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber focus:border-transparent bg-white cursor-pointer appearance-none">
          <option value="newest">Newest</option>
          <option value="price_low">Price: Low to High</option>
          <option value="price_high">Price: High to Low</option>
          <option value="most_ordered">Most Ordered</option>
        </select>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-navy text-white">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Product</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Category</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Price</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Status</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Orders</th>
              <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Total Sold</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody" class="bg-white divide-y divide-gray-200">
            <tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">Loading inventory...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('adminToken');
    if (!token) { window.location.href = '/admin/login.html'; }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('adminToken');
      window.location.href = '/admin/login.html';
    });

    let inventoryProducts = [];

    async function loadInventory() {
      try {
        const response = await fetch('/api/admin/inventory', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await response.json();
        if (data.success) {
          inventoryProducts = data.products;
          populateCategories();
          applyInventoryFilters();
        }
      } catch (error) { console.error('Error loading inventory:', error); showMessage('Failed to load inventory', 'error'); }
    }

    function populateCategories() {
      const select = document.getElementById('categoryFilter');
      const categories = [...new Set(inventoryProducts.map(p => p.category).filter(Boolean))].sort();
      select.innerHTML = '<option value="all">All Categories</option>' +
        categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    }

    function applyInventoryFilters() {
      const status = document.getElementById('statusFilter').value;
      const category = document.getElementById('categoryFilter').value;
      const sort = document.getElementById('sortFilter').value;

      let products = [...inventoryProducts];

      if (status === 'in_stock') products = products.filter(p => p.in_stock);
      else if (status === 'out_of_stock') products = products.filter(p => !p.in_stock);

      if (category !== 'all') products = products.filter(p => p.category === category);

      switch (sort) {
        case 'price_low': products.sort((a, b) => a.price - b.price); break;
        case 'price_high': products.sort((a, b) => b.price - a.price); break;
        case 'most_ordered': products.sort((a, b) => (b.order_count || 0) - (a.order_count || 0)); break;
        default: break;
      }

      renderInventory(products);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderInventory(products) {
      const tbody = document.getElementById('inventoryTableBody');
      if (products.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No products found</td></tr>'; return; }
      tbody.innerHTML = products.map(p => `
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-4"><div class="text-sm font-medium text-navy">${p.name}</div></td>
          <td class="px-6 py-4 text-sm text-gray-900">${p.category || 'N/A'}</td>
          <td class="px-6 py-4 text-sm font-bold text-amber">₵${parseFloat(p.price).toFixed(2)}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${p.in_stock ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${p.in_stock ? 'In Stock' : 'Out of Stock'}</span>
          </td>
          <td class="px-6 py-4 text-sm text-gray-900">${p.order_count}</td>
          <td class="px-6 py-4 text-sm text-gray-900">${p.total_ordered || 0}</td>
        </tr>
      `).join('');
    }

    function showMessage(message, type) {
      const div = document.createElement('div');
      div.className = `fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg z-50 ${type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`;
      div.textContent = message;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => loadInventory());
  </script>
</body>
</html>
